    <script>
      // Suppress benign Vite HMR WebSocket reconnection errors in the Cloud Run iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && reason.message) ? reason.message : String(reason || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event && event.message ? event.message : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
